<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#000000">
<meta name="description" content="Liquid Glass Dialer">

<title>Phone</title>

<style>
:root{
  --green:#30d158;
  --white:#f5f5f7;
  --gray:#8e8e93;
  --line:rgba(255,255,255,.075);
  --glass:rgba(255,255,255,.065);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#000;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,
  "SF Pro Display","SF Pro Text","Segoe UI",sans-serif;
  color:var(--white);
}

button{
  font:inherit;
}

.app{
  position:relative;
  width:100%;
  height:100dvh;
  max-width:430px;
  margin:auto;
  overflow:hidden;
  background:#000;
}

/* Subtle liquid light */

.app::before{
  content:"";
  position:absolute;
  width:390px;
  height:390px;
  left:-190px;
  top:-180px;
  border-radius:50%;
  background:rgba(70,100,255,.075);
  filter:blur(100px);
  pointer-events:none;
}

.app::after{
  content:"";
  position:absolute;
  width:340px;
  height:340px;
  right:-180px;
  bottom:-150px;
  border-radius:50%;
  background:rgba(130,70,255,.065);
  filter:blur(100px);
  pointer-events:none;
}

/* SVG */

svg{
  width:100%;
  height:100%;
  display:block;
}

.icon{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* Screens */

.screen{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  padding-top:var(--safe-top);
}

.screen.active{
  display:flex;
  animation:screenIn .26s cubic-bezier(.22,.8,.25,1);
}

@keyframes screenIn{
  from{
    opacity:0;
    transform:translateY(7px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* Header */

.header{
  height:78px;
  padding:20px 21px 8px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
}

.header h1{
  margin:0;
  font-size:32px;
  line-height:1;
  letter-spacing:-1.2px;
  font-weight:700;
}

.header-button{
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:var(--glass);
  color:#fff;
  padding:9px;
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  transition:.15s;
}

.header-button:active{
  transform:scale(.88);
  background:rgba(255,255,255,.14);
}

/* Search */

.search{
  height:36px;
  margin:12px 18px 9px;
  padding:0 12px;
  border-radius:11px;
  background:rgba(255,255,255,.065);
  border:1px solid rgba(255,255,255,.045);
  color:#85858b;
  display:flex;
  align-items:center;
  gap:7px;
  font-size:15px;
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
}

.search .icon{
  width:16px;
  height:16px;
  stroke-width:2;
}

/* Lists */

.list{
  flex:1;
  overflow:auto;
  padding:3px 18px 15px;
}

.row{
  min-height:62px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--line);
}

.avatar{
  width:44px;
  height:44px;
  flex:none;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  font-weight:600;
  color:#ddd;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.15),
      rgba(255,255,255,.035)
    );
  border:1px solid rgba(255,255,255,.075);
}

.row-info{
  flex:1;
  min-width:0;
}

.row-name{
  font-size:16px;
  font-weight:500;
  letter-spacing:-.15px;
}

.row-number{
  margin-top:3px;
  font-size:13px;
  color:#85858b;
}

.call-mini{
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.055);
  color:var(--green);
  padding:9px;
  transition:.12s;
}

.call-mini:active{
  transform:scale(.85);
  background:rgba(255,255,255,.13);
}

/* Bottom navigation */

.bottom{
  height:calc(64px + var(--safe-bottom));
  padding-bottom:var(--safe-bottom);
  flex:none;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:rgba(12,12,14,.70);
  border-top:1px solid rgba(255,255,255,.06);
  backdrop-filter:blur(35px) saturate(160%);
  -webkit-backdrop-filter:blur(35px) saturate(160%);
}

.nav{
  position:relative;
  border:0;
  background:none;
  color:#77777d;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:10px;
  transition:color .2s,transform .2s;
}

.nav .icon{
  width:23px;
  height:23px;
  stroke-width:1.7;
}

.nav.active{
  color:#fff;
}

.nav:active{
  transform:scale(.87);
}

/* Dialer */

.dial-header{
  height:62px;
  flex:none;
}

.display{
  flex:1;
  min-height:100px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:0 20px 16px;
}

.number{
  width:100%;
  min-height:53px;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  font-size:40px;
  font-weight:300;
  letter-spacing:.4px;
  transition:font-size .2s ease;
}

.number.small{
  font-size:28px;
}

.keypad{
  flex:none;
  padding:0 30px 8px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:13px 20px;
}

.key{
  position:relative;
  width:100%;
  aspect-ratio:1;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.06);
  color:#fff;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.10),
      rgba(255,255,255,.032)
    );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.075),
    0 5px 15px rgba(0,0,0,.24);

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  transition:
    transform .10s cubic-bezier(.2,.8,.2,1),
    background .15s;
}

.key::after{
  content:"";
  position:absolute;
  width:18px;
  height:18px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  opacity:0;
  transform:scale(.1);
}

.key:active{
  transform:scale(.91);
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.19),
      rgba(255,255,255,.06)
    );
}

.key:active::after{
  animation:ripple .35s ease-out;
}

@keyframes ripple{
  0%{
    opacity:.45;
    transform:scale(.2);
  }
  100%{
    opacity:0;
    transform:scale(5);
  }
}

.digit{
  font-size:27px;
  font-weight:300;
  z-index:1;
}

.letters{
  font-size:8px;
  letter-spacing:2px;
  color:#919198;
  margin-top:2px;
  z-index:1;
}

/* Call */

.call-area{
  height:91px;
  flex:none;
  display:flex;
  justify-content:center;
  align-items:center;
}

.call{
  width:67px;
  height:67px;
  border:0;
  border-radius:50%;
  color:#fff;
  background:linear-gradient(145deg,#42df72,#24b957);
  box-shadow:
    0 10px 28px rgba(48,209,88,.22),
    inset 0 1px 1px rgba(255,255,255,.35);
  padding:20px;
  transition:.12s;
}

.call:active{
  transform:scale(.88);
}

/* Incoming call */

.incoming{
  position:absolute;
  inset:0;
  z-index:50;
  display:none;
  flex-direction:column;
  align-items:center;

  background:
    radial-gradient(
      circle at 50% 22%,
      rgba(80,100,255,.11),
      transparent 42%
    ),
    rgba(0,0,0,.94);

  backdrop-filter:blur(45px);
  -webkit-backdrop-filter:blur(45px);
}

.incoming.show{
  display:flex;
  animation:incomingIn .38s cubic-bezier(.2,.8,.2,1);
}

@keyframes incomingIn{
  from{
    opacity:0;
    transform:scale(1.025);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.incoming-label{
  padding-top:65px;
  color:#99999f;
  font-size:14px;
}

.incoming-avatar{
  width:112px;
  height:112px;
  margin-top:48px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  font-weight:600;
  color:#ddd;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.17),
      rgba(255,255,255,.035)
    );

  border:1px solid rgba(255,255,255,.1);

  box-shadow:
    0 25px 70px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.15);
}

.incoming-name{
  margin-top:20px;
  font-size:30px;
  font-weight:600;
  letter-spacing:-.7px;
}

.incoming-number{
  margin-top:5px;
  color:#85858b;
  font-size:14px;
}

/* Slider */

.answer-container{
  width:calc(100% - 44px);
  margin-top:auto;
  margin-bottom:45px;
}

.slider{
  position:relative;
  height:66px;
  border-radius:35px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.03)
    );

  border:1px solid rgba(255,255,255,.075);

  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);

  overflow:hidden;
}

.slider-text{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#9b9ba2;
  font-size:14px;
  pointer-events:none;
}

.slider-knob{
  position:absolute;
  left:4px;
  top:4px;
  width:58px;
  height:58px;
  border-radius:50%;

  background:
    linear-gradient(
      145deg,
      #4ae978,
      #24b952
    );

  box-shadow:
    0 6px 22px rgba(48,209,88,.28),
    inset 0 1px 1px rgba(255,255,255,.35);

  padding:18px;
  touch-action:none;
}

/* Active call */

.calling{
  position:absolute;
  inset:0;
  z-index:60;
  display:none;
  flex-direction:column;
  align-items:center;
  background:#000;
}

.calling.show{
  display:flex;
  animation:screenIn .28s ease;
}

.call-status{
  padding-top:65px;
  color:var(--green);
  font-size:14px;
}

.call-avatar{
  width:108px;
  height:108px;
  margin-top:50px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.08);
}

.call-name{
  margin-top:18px;
  font-size:28px;
  font-weight:600;
}

.call-time{
  margin-top:7px;
  color:#77777e;
}

.call-controls{
  margin-top:auto;
  margin-bottom:50px;
  display:flex;
  gap:20px;
}

.control{
  width:70px;
  height:70px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:50%;
  background:rgba(255,255,255,.065);
  color:#fff;
  padding:18px;
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  transition:.15s;
}

.control.on{
  background:#fff;
  color:#111;
}

.control:active{
  transform:scale(.9);
}

.end{
  background:#ff3b30;
  border-color:transparent;
}

/* Toast */

.toast{
  position:absolute;
  z-index:100;
  left:50%;
  bottom:90px;
  transform:translate(-50%,15px);
  padding:9px 15px;
  border-radius:17px;
  background:rgba(35,35,38,.82);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(25px);
  color:#ddd;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}
</style>
</head>

</svg>

</div>

</div>

</div>

</section>


<!-- ACTIVE CALL -->

<section class="calling" id="calling">

<div class="call-status">
Connected
</div>

<div class="call-avatar" id="callAvatar">
A
</div>

<div class="call-name" id="callName">
Abir
</div>

<div class="call-time" id="callTime">
00:00
</div>

<div class="call-controls">

<button class="control" id="muteBtn" onclick="toggleControl('muteBtn')">
<svg class="icon"><use href="#i-mic"/></svg>
</button>

<button class="control" id="speakerBtn" onclick="toggleControl('speakerBtn')">
<svg class="icon"><use href="#i-speaker"/></svg>
</button>

<button class="control" onclick="goToScreen('keypad')">
<svg class="icon"><use href="#i-keypad"/></svg>
</button>

<button class="control end" onclick="endCall()">
<svg class="icon"><use href="#i-phone"/></svg>
</button>

</div>

</section>


<div class="toast" id="toast"></div>

</div>


<script>

/* NAVIGATION */

const navItems=[
  ["recents","i-clock","Recents"],
  ["contacts","i-person","Contacts"],
  ["favorites","i-star","Favorites"],
  ["keypad","i-grid","Keypad"]
];

function goToScreen(id){
  document
    .querySelectorAll(".screen")
    .forEach(x=>x.classList.remove("active"));

  document
    .getElementById(id)
    .classList.add("active");
}

document.querySelectorAll(".screen").forEach(screen=>{

  const bottom=document.createElement("nav");
  bottom.className="bottom";

  navItems.forEach(item=>{

    const button=document.createElement("button");

    button.className="nav";

    if(screen.id===item[0]){
      button.classList.add("active");
    }

    button.innerHTML=`
      <svg class="icon">
        <use href="#${item[1]}"/>
      </svg>
      <span>${item[2]}</span>
    `;

    button.onclick=()=>{
      goToScreen(item[0]);
    };

    bottom.appendChild(button);

  });

  screen.appendChild(bottom);

});


/* TOAST */

let toastTimer=null;

function showToast(message){

  const toast=document.getElementById("toast");

  toast.textContent=message;
  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{
    toast.classList.remove("show");
  },1800);

}


/* DIAL PAD */

let phone="";

const number=
document.getElementById("number");

function press(value){

  if(phone.length>=18)
    return;

  phone+=value;

  number.textContent=phone;

  if(phone.length>10)
    number.classList.add("small");
  else
    number.classList.remove("small");

  if(navigator.vibrate)
    navigator.vibrate(7);

}


function makeCall(){

  if(!phone){

    showToast("Enter a number");

    return;
  }

  startActiveCall(phone,phone);

}


/* INCOMING */

const incoming=
document.getElementById("incoming");

let currentCaller={name:"Abir",num:"01700 000000"};

function incomingCall(name,num){

  currentCaller={name,num};

  document.getElementById("incomingName").textContent=name;
  document.getElementById("incomingNumber").textContent=num;
  document.getElementById("incomingAvatar").textContent=name.charAt(0).toUpperCase();

  resetSliderPosition();

  incoming.classList.add("show");

}

function declineCall(){

  incoming.classList.remove("show");
  showToast("Call declined");

}


/* SLIDER (slide to answer) */

const slider=
document.getElementById("slider");

const knob=
document.getElementById("sliderKnob");

let dragging=false;
let startX=0;
let knobX=0;

function maxKnobTravel(){
  return slider.clientWidth-knob.clientWidth-8;
}

function resetSliderPosition(){
  knobX=0;
  knob.style.transform="translateX(0px)";
}

function setKnobX(x){

  const max=maxKnobTravel();

  knobX=Math.max(0,Math.min(x,max));

  knob.style.transform=`translateX(${knobX}px)`;

}

knob.addEventListener("pointerdown",e=>{

  dragging=true;
  startX=e.clientX-knobX;

  knob.setPointerCapture(e.pointerId);

});


knob.addEventListener("pointermove",e=>{

  if(!dragging)
    return;

  const rect=slider.getBoundingClientRect();
  const relativeX=e.clientX-startX;

  setKnobX(relativeX);

  const max=maxKnobTravel();

  if(max>0 && knobX>=max-2){
    dragging=false;
    answerCall();
  }

});


function endDrag(e){

  if(!dragging)
    return;

  dragging=false;

  const max=maxKnobTravel();

  if(max<=0 || knobX<max-2){
    resetSliderPosition();
  }

}

knob.addEventListener("pointerup",endDrag);
knob.addEventListener("pointercancel",endDrag);


function answerCall(){

  incoming.classList.remove("show");

  startActiveCall(currentCaller.name,currentCaller.num);

}


/* ACTIVE CALL */

const calling=document.getElementById("calling");
const callTimeEl=document.getElementById("callTime");

let callSeconds=0;
let callTimerInterval=null;

function startActiveCall(name,num){

  document.getElementById("callName").textContent=name;
  document.getElementById("callAvatar").textContent=name.charAt(0).toUpperCase();

  callSeconds=0;
  callTimeEl.textContent="00:00";

  clearInterval(callTimerInterval);

  callTimerInterval=setInterval(()=>{

    callSeconds++;

    const m=String(Math.floor(callSeconds/60)).padStart(2,"0");
    const s=String(callSeconds%60).padStart(2,"0");

    callTimeEl.textContent=`${m}:${s}`;

  },1000);

  calling.classList.add("show");

}

function endCall(){

  clearInterval(callTimerInterval);

  calling.classList.remove("show");

  phone="";
  number.textContent="";
  number.classList.remove("small");

  document
    .querySelectorAll(".control")
    .forEach(c=>c.classList.remove("on"));

  showToast("Call ended");

  goToScreen("recents");

}

function toggleControl(id){

  document.getElementById(id).classList.toggle("on");

}

</script>

</body>
</html>
